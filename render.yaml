services:
  - type: web
    name: plasticprecious-api
    env: python
    pythonVersion: 3.12
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --worker-class sync --timeout 60 --access-logfile - --error-logfile - --log-level info
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: 'False'
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        value: '*'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_qgujRL2G7oFZ@ep-falling-dust-axxbaofs-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
