services:
  - type: web
    name: plasticprecious-api
    env: python
    pythonVersion: 3.12
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --worker-class sync --timeout 60 --access-logfile - --error-logfile - --log-level info
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: 'False'
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        fromDatabase:
          name: plasticprecious
          property: render_url
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: plasticprecious
          property: connection_string

  - type: pserv
    name: plasticprecious-db
    env: postgres
    plan: free
    ipAllowList: []
    maxClientConnections: 20

databases:
  - name: plasticprecious
    databaseName: plasticprecious_db
    user: postgres
    plan: free
    postgresMajorVersion: 15
